<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420"
     font-family="Archivo, sans-serif">
<!--
  Web copy of figures/src/hapi_framework.svg in the paper repo. Only the type is changed:
  Libertinus Serif / Inter -> Archivo, DejaVu Sans Mono -> IBM Plex Mono, bold ->
  600 (Archivo) / 500 (Plex Mono); a few labels are set slightly smaller so the
  wider face fits the paper's boxes. Geometry and wording are the paper's.
  Colours are the paper's roles in the site palette, converted by
  ~/.claude/jobs/f45a817f/scripts/recolour_diagrams.py (fixed role map, then
  OKLCH with lightness kept); paper-accent text is #b44a2c for contrast.
  Ids carry a "hf-" prefix so the inlined drawings never clash; data-hl groups
  get the hover-lift in figures.css.
-->
<defs>
  <marker id="hf-a" viewBox="0 0 8 6" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0d1b2a"/></marker>
  <marker id="hf-o" viewBox="0 0 8 6" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#f67552"/></marker>
  <marker id="hf-g" viewBox="0 0 8 6" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#5d6f81"/></marker>
  <g id="hf-person" fill="none" stroke-width="1.3" stroke-linecap="round">
    <circle cx="10" cy="6.5" r="4"/><path d="M2.5,19 Q2.5,12 10,12 Q17.5,12 17.5,19"/>
  </g>
  <g id="hf-pair" fill="none" stroke-width="1.3" stroke-linecap="round">
    <circle cx="7" cy="6.5" r="4"/><path d="M0.5,19 Q0.5,12.5 7,12.5 Q13.5,12.5 13.5,19"/>
    <circle cx="16" cy="9" r="3"/><path d="M12.5,19 Q12.5,14 16,14 Q19.5,14 19.5,19"/>
  </g>
  <g id="hf-scale" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="9" width="16" height="9" rx="1.5"/>
    <path d="M5,9 A5,5 0 0 1 15,9"/>
    <path d="M10,9 L12.5,5.5"/>
    <path d="M6,14 H14"/>
  </g>
  <g id="hf-agent" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="7" width="15" height="11.5" rx="2.5" fill="none"/>
    <path d="M10,7 V3.5" fill="none"/>
    <circle cx="10" cy="2.5" r="1.3" stroke="none"/>
    <circle cx="7" cy="12" r="1.3" stroke="none"/><circle cx="13" cy="12" r="1.3" stroke="none"/>
    <path d="M7.5,15.5 H12.5" fill="none"/>
  </g>
  <g id="hf-cross" fill="none" stroke-width="1.3" stroke-linejoin="round">
    <rect x="2" y="2" width="16" height="16" rx="2"/><path d="M10,6 V14 M6,10 H14"/>
  </g>
  <g id="hf-house" fill="none" stroke-width="1.3" stroke-linejoin="round">
    <path d="M2.5,10.5 L10,3.5 L17.5,10.5"/><path d="M4.5,9.5 V18 H15.5 V9.5"/><path d="M8.5,18 V13 H11.5 V18"/>
  </g>
</defs>

<rect x="0" y="0" width="600" height="420" fill="#FFFFFF"/>

<!-- headings -->
<use href="#hf-cross" x="8" y="8" stroke="#5d6f81"/>
<text x="34" y="23" font-family="Archivo, sans-serif" font-size="11" font-weight="600" fill="#5d6f81" letter-spacing="0.6">HOSPITAL AND COMMUNITY CARE CENTRE</text>
<use href="#hf-house" x="498" y="8" stroke="#5d6f81"/>
<text x="524" y="23" font-family="Archivo, sans-serif" font-size="11" font-weight="600" fill="#5d6f81" letter-spacing="0.6">AT HOME</text>

<!-- staff panel 8..152, home panel 464..592 -->
<rect x="6" y="58" width="140" height="326" rx="4" fill="#f2f5f9" stroke="#dce4ee" stroke-width="1"/>
<rect x="464" y="58" width="128" height="326" rx="4" fill="#f2f5f9" stroke="#dce4ee" stroke-width="1"/>

<!-- agent: box 244..374 x 78..334, text at 256. Shorter than the side panels. -->
<g data-hl="">
<title>Care pathway agent: Reads the record. Tracks open items. Prepares the next step. Asks for judgements. Records decisions. Makes no decisions.</title>
<g data-actor="agent">
<rect x="244" y="78" width="130" height="256" rx="4" fill="#FFFFFF" stroke="#0d1b2a" stroke-width="1.2"/>
<use href="#hf-agent" x="256" y="88" stroke="#0d1b2a" fill="#0d1b2a"/>
<text x="256" y="128" font-size="11.9" font-weight="600" fill="#0d1b2a">Care pathway agent</text>
<line x1="256" y1="140" x2="362" y2="140" stroke="#dce4ee" stroke-width="1"/>
<g font-size="11.5" fill="#0d1b2a">
  <text font-size="10.2" x="256" y="161">Reads the record</text>
  <text font-size="10.2" x="256" y="184">Tracks open items</text>
  <text font-size="10.2" x="256" y="207">Prepares the next step</text>
  <text font-size="10.2" x="256" y="230">Asks for judgements</text>
  <text font-size="10.2" x="256" y="253">Records decisions</text>
</g>
<line x1="256" y1="268" x2="362" y2="268" stroke="#dce4ee" stroke-width="1"/>
<text x="256" y="289" font-size="10.6" font-weight="600" fill="#0d1b2a">Makes no decisions.</text>
<text x="256" y="305" font-size="9.9" fill="#3d4f63">Continues through</text>
<text x="256" y="318" font-size="9.9" fill="#3d4f63">every handoff.</text>
</g>
</g>

<!-- ward nurse: agent asks, nurse replies -->
<g data-hl="">
<title>Ward nurse: asks nurse “Grade her breathlessness.” nurse replies “Worse than at admission.”</title>
<g data-actor="nurse" font-size="11.5" font-weight="600" fill="#0d1b2a">
  <rect x="12" y="70" width="128" height="72" rx="2" fill="#FFFFFF" stroke="#dce4ee" stroke-width="1"/>
  <use href="#hf-person" x="18" y="96" stroke="#3d4f63"/>
  <text font-size="10.6" x="44" y="110">Ward nurse</text>
</g>
<text data-step="1" data-role="label" x="195" y="77" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b44a2c">asks nurse</text>
<line data-step="1" x1="242" y1="85" x2="142" y2="85" stroke="#f67552" stroke-width="1.3" marker-end="url(#hf-o)"/>
<text data-step="1" data-role="quote" x="195" y="99" text-anchor="middle" font-size="9.7" font-style="italic" fill="#5d6f81">&#8220;Grade her</text>
<text data-step="1" data-role="quote" x="195" y="112" text-anchor="middle" font-size="9.7" font-style="italic" fill="#5d6f81">breathlessness.&#8221;</text>
<text data-step="3" data-role="label" x="195" y="131" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0d1b2a">nurse replies</text>
<line data-step="3" x1="142" y1="139" x2="240" y2="139" stroke="#0d1b2a" stroke-width="1.3" marker-end="url(#hf-a)"/>
<text data-step="3" data-role="quote" x="195" y="153" text-anchor="middle" font-size="9.7" font-style="italic" fill="#5d6f81">&#8220;Worse than</text>
<text data-step="3" data-role="quote" x="195" y="166" text-anchor="middle" font-size="9.7" font-style="italic" fill="#5d6f81">at admission.&#8221;</text>
</g>

<!-- consultant: agent shows the consultant the case; consultant decides -->
<g data-hl="">
<title>Consultant, ward: shows consultant the record and open items; consultant decides “Discharge on Friday.”</title>
<g data-actor="consultant" font-size="11.5" font-weight="600" fill="#0d1b2a">
  <rect x="12" y="192" width="128" height="72" rx="2" fill="#FFFFFF" stroke="#0d1b2a" stroke-width="1.5"/>
  <use href="#hf-person" x="18" y="218" stroke="#0d1b2a"/>
  <text font-size="10.6" x="44" y="226">Consultant</text>
  <text x="44" y="241" font-size="9.9" font-weight="normal" fill="#3d4f63">ward</text>
</g>
<text data-step="4" data-role="label" x="195" y="199" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5d6f81">shows consultant</text>
<line data-step="4" x1="242" y1="207" x2="142" y2="207" stroke="#5d6f81" stroke-width="1.3" marker-end="url(#hf-g)"/>
<text data-step="4" data-role="quote" x="195" y="221" text-anchor="middle" font-size="9.9" fill="#5d6f81">the record and</text>
<text data-step="4" data-role="quote" x="195" y="234" text-anchor="middle" font-size="9.9" fill="#5d6f81">open items</text>
<text data-step="5" data-role="label" x="195" y="253" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0d1b2a">consultant decides</text>
<line data-step="5" x1="142" y1="261" x2="240" y2="261" stroke="#0d1b2a" stroke-width="1.3" marker-end="url(#hf-a)"/>
<text data-step="5" data-role="quote" x="195" y="275" text-anchor="middle" font-size="9.7" font-style="italic" fill="#5d6f81">&#8220;Discharge</text>
<text data-step="5" data-role="quote" x="195" y="288" text-anchor="middle" font-size="9.7" font-style="italic" fill="#5d6f81">on Friday.&#8221;</text>
</g>

<!-- community nurse: agent shows the community nurse the scale report, the same line the scale sent -->
<g data-hl="">
<title>Community nurse, community care: shows scale report “Morning weight recorded.”</title>
<g data-actor="community" font-size="11.5" font-weight="600" fill="#0d1b2a">
  <rect x="12" y="304" width="128" height="60" rx="2" fill="#FFFFFF" stroke="#0d1b2a" stroke-width="1.5"/>
  <use href="#hf-person" x="18" y="324" stroke="#0d1b2a"/>
  <text x="44" y="330" font-size="10.5">Community nurse</text>
  <text x="44" y="345" font-size="9.9" font-weight="normal" fill="#3d4f63">community care</text>
</g>
<text data-step="11" data-role="label" x="195" y="311" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5d6f81">shows scale report</text>
<line data-step="11" x1="242" y1="319" x2="142" y2="319" stroke="#5d6f81" stroke-width="1.3" marker-end="url(#hf-g)"/>
<text data-step="11" data-role="quote" x="195" y="333" text-anchor="middle" font-size="9.7" font-style="italic" fill="#5d6f81">&#8220;Morning weight</text>
<text data-step="11" data-role="quote" x="195" y="346" text-anchor="middle" font-size="9.7" font-style="italic" fill="#5d6f81">recorded.&#8221;</text>
</g>

<!-- patient: agent asks about her breathing, patient reports -->
<g data-hl="">
<title>The patient: asks patient “How is your breathing today?” patient reports “I am more breathless today.”</title>
<g data-actor="patient" font-size="11.5" font-weight="600" fill="#0d1b2a">
  <rect x="472" y="70" width="112" height="72" rx="2" fill="#FFFFFF" stroke="#dce4ee" stroke-width="1"/>
  <use href="#hf-person" x="477" y="90" stroke="#3d4f63"/>
  <text font-size="10.6" x="503" y="96">The patient</text>
  <text x="503" y="111" font-size="9.9" font-weight="normal" fill="#3d4f63">Symptoms and</text>
  <text x="503" y="124" font-size="9.9" font-weight="normal" fill="#3d4f63">medication taken</text>
</g>
<text data-step="6" data-role="label" x="419" y="77" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b44a2c">asks patient</text>
<line data-step="6" x1="376" y1="85" x2="470" y2="85" stroke="#f67552" stroke-width="1.3" marker-end="url(#hf-o)"/>
<text data-step="6" data-role="quote" x="419" y="99" text-anchor="middle" font-size="9.7" font-style="italic" fill="#5d6f81">&#8220;How is your</text>
<text data-step="6" data-role="quote" x="419" y="112" text-anchor="middle" font-size="9.7" font-style="italic" fill="#5d6f81">breathing today?&#8221;</text>
<text data-step="7" data-role="label" x="419" y="131" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0d1b2a">patient reports</text>
<line data-step="7" x1="470" y1="139" x2="378" y2="139" stroke="#0d1b2a" stroke-width="1.3" marker-end="url(#hf-a)"/>
<text data-step="7" data-role="quote" x="419" y="153" text-anchor="middle" font-size="9.7" font-style="italic" fill="#5d6f81">&#8220;I am more</text>
<text data-step="7" data-role="quote" x="419" y="166" text-anchor="middle" font-size="9.7" font-style="italic" fill="#5d6f81">breathless today.&#8221;</text>
</g>

<!-- caregiver: agent asks, caregiver replies -->
<g data-hl="">
<title>Caregiver: asks caregiver “Can you collect the refill?” caregiver replies “Collected it today.”</title>
<g data-actor="caregiver" font-size="11.5" font-weight="600" fill="#0d1b2a">
  <rect x="472" y="192" width="112" height="72" rx="2" fill="#FFFFFF" stroke="#dce4ee" stroke-width="1"/>
  <use href="#hf-pair" x="477" y="220" stroke="#3d4f63"/>
  <text font-size="10.6" x="503" y="226">Caregiver</text>
</g>
<text data-step="8" data-role="label" x="419" y="199" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b44a2c">asks caregiver</text>
<line data-step="8" x1="376" y1="207" x2="470" y2="207" stroke="#f67552" stroke-width="1.3" marker-end="url(#hf-o)"/>
<text data-step="8" data-role="quote" x="419" y="221" text-anchor="middle" font-size="9.7" font-style="italic" fill="#5d6f81">&#8220;Can you collect</text>
<text data-step="8" data-role="quote" x="419" y="234" text-anchor="middle" font-size="9.7" font-style="italic" fill="#5d6f81">the refill?&#8221;</text>
<text data-step="9" data-role="label" x="419" y="253" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0d1b2a">caregiver replies</text>
<line data-step="9" x1="470" y1="261" x2="378" y2="261" stroke="#0d1b2a" stroke-width="1.3" marker-end="url(#hf-a)"/>
<text data-step="9" data-role="quote" x="419" y="275" text-anchor="middle" font-size="9.7" font-style="italic" fill="#5d6f81">&#8220;Collected it</text>
<text data-step="9" data-role="quote" x="419" y="288" text-anchor="middle" font-size="9.7" font-style="italic" fill="#5d6f81">today.&#8221;</text>
</g>

<!-- devices: the scale reports -->
<g data-hl="">
<title>Devices, scale and BP cuff: scale reports “Morning weight recorded.”</title>
<g data-actor="devices" font-size="11.5" font-weight="600" fill="#0d1b2a">
  <rect x="472" y="304" width="112" height="48" rx="2" fill="#FFFFFF" stroke="#dce4ee" stroke-width="1"/>
  <use href="#hf-scale" x="477" y="318" stroke="#3d4f63"/>
  <text font-size="10.6" x="503" y="324">Devices</text>
  <text x="503" y="339" font-size="9.9" font-weight="normal" fill="#3d4f63">Scale and BP cuff</text>
</g>
<text data-step="10" data-role="label" x="419" y="311" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0d1b2a">scale reports</text>
<line data-step="10" x1="470" y1="319" x2="378" y2="319" stroke="#0d1b2a" stroke-width="1.3" marker-end="url(#hf-a)"/>
<text data-step="10" data-role="quote" x="419" y="333" text-anchor="middle" font-size="9.7" font-style="italic" fill="#5d6f81">&#8220;Morning weight</text>
<text data-step="10" data-role="quote" x="419" y="346" text-anchor="middle" font-size="9.7" font-style="italic" fill="#5d6f81">recorded.&#8221;</text>
</g>

<!-- direct contact, no agent: the ward nurse sees the patient herself -->
<g data-hl="">
<title>nurse sees patient: meet without the agent</title>
<path data-step="2" d="M76,70 V52 H528 V70" fill="none" stroke="#0d1b2a" stroke-width="1.3" stroke-dasharray="4 3" stroke-linejoin="round"/>
<text data-step="2" data-role="label" x="302" y="47" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0d1b2a">nurse sees patient</text>
</g>

<!-- legend: one row, four entries; two wordings shortened to fit 600 -->
<g data-legend="" font-size="11" fill="#3d4f63">
  <line x1="6" y1="408" x2="30" y2="408" stroke="#f67552" stroke-width="1.3" marker-end="url(#hf-o)"/>
  <text font-size="9.9" x="35" y="412">Agent calls a human</text>
  <line x1="141" y1="408" x2="165" y2="408" stroke="#0d1b2a" stroke-width="1.3" marker-end="url(#hf-a)"/>
  <text font-size="9.9" x="170" y="412">A human or device calls agent</text>
  <line x1="309" y1="408" x2="333" y2="408" stroke="#5d6f81" stroke-width="1.3" marker-end="url(#hf-g)"/>
  <text font-size="9.9" x="338" y="412">Agent shows the record</text>
  <line x1="460" y1="408" x2="484" y2="408" stroke="#0d1b2a" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text font-size="9.9" x="489" y="412">Meet without the agent</text>
</g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 424"
     font-family="Archivo, sans-serif">
<!--
  Web copy of figures/src/hapi_interfaces.svg in the paper repo. Only the type is changed:
  Libertinus Serif / Inter -> Archivo, DejaVu Sans Mono -> IBM Plex Mono, bold ->
  600 (Archivo) / 500 (Plex Mono); a few labels are set slightly smaller so the
  wider face fits the paper's boxes. Geometry and wording are the paper's.
  Colours are the paper's roles in the site palette, converted by
  ~/.claude/jobs/f45a817f/scripts/recolour_diagrams.py (fixed role map, then
  OKLCH with lightness kept); paper-accent text is #b44a2c for contrast.
  Ids carry a "hi-" prefix so the inlined drawings never clash; data-hl groups
  get the hover-lift in figures.css.
-->
<defs>
  <marker id="hi-a" viewBox="0 0 8 6" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 z" fill="#3d4f63"/>
  </marker>
</defs>
<rect x="0" y="0" width="600" height="424" fill="#FFFFFF"/>

<line x1="10" y1="19" x2="92" y2="19" stroke="#dce4ee" stroke-width="0.9"/>
<line x1="508" y1="19" x2="590" y2="19" stroke="#dce4ee" stroke-width="0.9"/>
<text x="300" y="23" text-anchor="middle" font-size="12" fill="#3d4f63">Case: heart failure &#183; admitted Tuesday &#183; weight reported from home had risen</text>

<!-- panel a -->
<g font-family="Archivo, sans-serif">
  <text x="10" y="58" font-family="Archivo, sans-serif" font-size="14" font-weight="600" fill="#0d1b2a">(a) Structured interface</text>
  <rect x="10" y="72" width="92" height="28" rx="2" fill="#FFFFFF" stroke="#0d1b2a" stroke-width="1"/>
  <text x="56" y="90.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0d1b2a">Agent</text>
</g>
<line x1="56" y1="100" x2="56" y2="118" stroke="#3d4f63" stroke-width="1" marker-end="url(#hi-a)"/>

<rect x="10" y="122" width="300" height="138" rx="2" fill="#FFFFFF" stroke="#0d1b2a" stroke-width="1"/>
<line x1="10" y1="152" x2="310" y2="152" stroke="#dce4ee" stroke-width="0.9"/>
<g font-family="'IBM Plex Mono', monospace">
  <text x="22" y="142.5" font-size="12.5" font-weight="600" fill="#0d1b2a">CALL grade_breathlessness</text>
  <g font-size="12">
    <g data-hl=""><title>source: ward nurse N-07</title>
      <rect x="11" y="160" width="298" height="19" fill="#FFFFFF" fill-opacity="0"/>
      <text x="22" y="174" fill="#5d6f81">source</text> <text x="112" y="174" fill="#0d1b2a">ward nurse N-07</text></g>
    <g data-hl=""><title>cost: 3 min of nurse time</title>
      <rect x="11" y="179" width="298" height="19" fill="#FFFFFF" fill-opacity="0"/>
      <text x="22" y="193" fill="#5d6f81">cost</text> <text x="112" y="193" fill="#0d1b2a">3 min of nurse time</text></g>
    <g data-hl=""><title>reliability: 0.92</title>
      <rect x="11" y="198" width="298" height="19" fill="#FFFFFF" fill-opacity="0"/>
      <text x="22" y="212" fill="#5d6f81">reliability</text> <text x="112" y="212" fill="#0d1b2a">0.92</text></g>
    <g data-hl=""><title>consent: accepted</title>
      <rect x="11" y="217" width="298" height="19" fill="#FFFFFF" fill-opacity="0"/>
      <text x="22" y="231" fill="#5d6f81">consent</text> <text x="112" y="231" fill="#0d1b2a">accepted</text></g>
    <g data-hl=""><title>record: #0142: call, reply, outcome</title>
      <rect x="11" y="236" width="298" height="19" fill="#FFFFFF" fill-opacity="0"/>
      <text x="22" y="250" fill="#5d6f81">record</text> <text x="112" y="250" fill="#0d1b2a">#0142: call, reply, outcome</text></g>
  </g>
</g>

<line x1="148" y1="260" x2="148" y2="278" stroke="#3d4f63" stroke-width="1" marker-end="url(#hi-a)"/>

<circle cx="148" cy="300" r="19" fill="#FFFFFF" stroke="#f67552" stroke-width="1.1"/>
<circle cx="148" cy="294" r="4.8" fill="none" stroke="#f67552" stroke-width="1.2"/>
<path d="M138.5,312 Q138.5,302.5 148,302.5 Q157.5,302.5 157.5,312" fill="none" stroke="#f67552" stroke-width="1.2"/>
<text x="148" y="333" text-anchor="middle" font-size="10" letter-spacing="1" fill="#b44a2c"
      font-family="Archivo, sans-serif">NURSE</text>

<line x1="148" y1="338" x2="148" y2="354" stroke="#3d4f63" stroke-width="1" marker-end="url(#hi-a)"/>

<g data-hl="">
<title>RETURN breathlessness_grade: “Worse than at admission”</title>
<rect x="10" y="358" width="276" height="56" rx="2" fill="#FFFFFF" stroke="#0d1b2a" stroke-width="1"/>
<text x="22" y="380" font-size="12.5" font-weight="600" fill="#0d1b2a"
      font-family="'IBM Plex Mono', monospace">RETURN breathlessness_grade</text>
<text x="22" y="400" font-size="12.5" font-style="italic" fill="#b44a2c">&#8220;Worse than at admission&#8221;</text>
</g>

<!-- panel b -->
<g font-family="Archivo, sans-serif">
  <text x="314" y="58" font-family="Archivo, sans-serif" font-size="14" font-weight="600" fill="#0d1b2a">(b) Free-form conversational interface</text>
  <rect x="314" y="72" width="92" height="28" rx="2" fill="#FFFFFF" stroke="#0d1b2a" stroke-width="1"/>
  <text x="360" y="90.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0d1b2a">Agent</text>
</g>

<g font-size="12.5">
  <g fill="#0d1b2a">
    <rect x="314" y="116" width="176" height="28" rx="14" fill="#FFFFFF" stroke="#3d4f63" stroke-width="0.9"/>
    <text x="328" y="134.5">How is her breathing today?</text>
    <rect x="314" y="210" width="160" height="28" rx="14" fill="#FFFFFF" stroke="#3d4f63" stroke-width="0.9"/>
    <text x="328" y="228.5">Can you grade it for me?</text>
    <rect x="314" y="304" width="200" height="28" rx="14" fill="#FFFFFF" stroke="#3d4f63" stroke-width="0.9"/>
    <text x="328" y="322.5">Has she been taking the tablets?</text>
  </g>
  <g fill="#b44a2c">
    <rect x="412" y="168" width="178" height="28" rx="14" fill="#FFFFFF" stroke="#f67552" stroke-width="0.9"/>
    <text x="576" y="186.5" text-anchor="end">A bit worse than yesterday.</text>
    <rect x="382" y="262" width="208" height="28" rx="14" fill="#FFFFFF" stroke="#f67552" stroke-width="0.9"/>
    <text x="576" y="280.5" text-anchor="end">Hard to say, she is anxious too.</text>
    <rect x="450" y="356" width="140" height="28" rx="14" fill="#FFFFFF" stroke="#f67552" stroke-width="0.9"/>
    <text x="576" y="374.5" text-anchor="end">I missed a few days.</text>
  </g>
</g>

<g font-family="Archivo, sans-serif" font-size="10" letter-spacing="1" fill="#b44a2c" text-anchor="end">
  <text x="590" y="162">NURSE</text>
  <text x="590" y="256">NURSE</text>
  <text x="590" y="350">PATIENT</text>
</g>

<text x="452" y="404" text-anchor="middle" font-size="11" fill="#5d6f81" font-family="Archivo, sans-serif">no grade returned &#183; no cost &#183; no consent state recorded</text>
</svg>

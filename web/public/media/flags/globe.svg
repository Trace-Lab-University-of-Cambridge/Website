<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 22" width="30" height="22">
  <!-- Ocean background -->
  <rect width="30" height="22" rx="2" fill="#1a6bb5"/>
  <!-- Globe circle clipped to rect -->
  <circle cx="15" cy="11" r="9" fill="#1a6bb5"/>
  <!-- Land masses — Africa/Europe style (🌍) -->
  <!-- Europe -->
  <path d="M13 4.5 L14.5 4 L15.5 5 L15 6.5 L13.5 7 L12.5 6 Z" fill="#4caf50"/>
  <!-- Africa -->
  <path d="M12 8 L14 7.5 L16 8.5 L16.5 11 L15.5 14 L13.5 15.5 L11.5 14.5 L11 12 L11.5 10 Z" fill="#4caf50"/>
  <!-- Small island / partial continent right -->
  <path d="M17 8 L18.5 8.5 L18.5 10 L17.5 10 L17 9 Z" fill="#4caf50"/>
  <!-- Globe outline -->
  <circle cx="15" cy="11" r="9" fill="none" stroke="#1050a0" stroke-width="0.5"/>
</svg>

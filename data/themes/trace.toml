# TRACE Lab Theme
# Fresh institutional direction — deep blue + coral on paper white

[light]
  # Primary - TRACE brand blue
  primary = "#164A9E"

  # Backgrounds - Paper white with a cool off-white for alternating bands
  background = "#ffffff"
  home_section_odd = "#F6F8FB"
  home_section_even = "#ffffff"

  # Text - Near-black cool ink
  text = "#191D26"
  text_muted = "#5B6472"

  # Links - Brand blue
  link = "#0C4FA3"
  link_hover = "#0A3F86"

  # Menu - Clean white navbar
  menu_primary = "#ffffff"
  menu_text = "#5B6472"
  menu_text_active = "#191D26"
  menu_title = "#191D26"

[dark]
  # Site runs light-only; dark kept in sync as a safe fallback
  primary = "#5AA0E6"

  background = "#0B1420"
  home_section_odd = "#101B2A"
  home_section_even = "#0B1420"

  text = "#EAF0F6"
  text_muted = "#93A3B3"

  link = "#7CB4EC"
  link_hover = "#A6CBF2"

  menu_primary = "#0B1420"
  menu_text = "#C6D2DE"
  menu_text_active = "#ffffff"
  menu_title = "#ffffff"

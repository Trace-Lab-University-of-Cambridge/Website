# Alumni, on their own page at /alumni/, grouped by the role people held here
# — the way STAIR does it. Empty until Umang supplies the names.
#
# Same fields as `groups` above (name, photo, url, flags), plus:
#   year   Year they finished. Optional; shown as a mono code under the name.
#
# Groups with no people are skipped, and both the /alumni/ page link in the nav
# and the "Alumni" line in the People section stay hidden until at least one
# group has an entry. Add names and everything appears.
#
#   groups:
#     - label: PhD alumni
#       people:
#         - name: Jane Doe
#           photo: jane-doe.jpg
#           url: https://example.com
#           next: Postdoc, MIT
alumni:

# TRACE Lab roster.
#
# This file is the single source of truth for everyone on the site. To add a
# person, add an entry here — no HTML anywhere. To move someone on, cut their
# entry and paste it under `alumni`.
#
# Fields
#   name     Full name, as they write it.
#   flags    ISO 3166-1 alpha-2 codes, lowercase. An SVG must exist at
#            assets/media/flags/<code>.svg. Order is the person's own.
#   photo    Filename in static/media/team/. Omit for placeholder.
#   url      Where their name links. Omit for no link.
#   advisor  Co-supervisor, rendered as "w/ <name>".
#   tags     Short qualifiers, e.g. CST (Dept. of Computer Science and
#            Technology). Expanded to tooltips in the person partial.

groups:

# Logo rows under Partners.
#
# `file` is optional — an entry without one renders as a text link.
# `height` overrides the default 32px, for logos whose artwork sits inside a
# lot of internal whitespace and would otherwise look undersized.
groups:
  - label: Industry
    logos:
      - { file: logos/aisi.svg, alt: UK AI Security Institute, url: 'https://www.aisi.gov.uk/' }
      - { file: logos/nhs.svg, alt: NHS, url: 'https://www.nhs.uk/' }
      - { file: logos/accenture.svg, alt: Accenture, url: 'https://www.accenture.com/' }
  - label: Academic
    logos:
      - { file: logos/mbzuai.png, alt: MBZUAI, url: 'https://mbzuai.ac.ae/' }
      - { file: logos/aims.png, alt: African Institute for Mathematical Sciences, url: 'https://aims.ac.rw/' }
      - { file: logos/udla.png, alt: Universidad de las Américas, url: 'https://www.udla.edu.ec/', height: 80 }
      - { file: logos/stanford-law.png, alt: Stanford AI Law Initiative, url: 'https://law.stanford.edu/stanford-ai-law-initiative/' }
  - label: Foundations
    logos:
      - { file: logos/raii.png, alt: Responsible AI Institute, url: 'https://www.responsible.ai/' }
      - { file: logos/fli.png, alt: Future of Life Institute, url: 'https://futureoflife.org/' }

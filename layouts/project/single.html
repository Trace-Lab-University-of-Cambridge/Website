{{- define "main" -}}

{{- $slug := .File.ContentBaseName -}}

<article class="article article-project project-page-custom" data-project="{{ $slug }}">

  <div class="project-hero">
    <div class="project-hero-pattern"></div>
    <div class="project-hero-content">
      <p class="project-lab-name"><b>TR</b>ustworthy <b>A</b>rtificial Intelligen<b>CE</b></p>
      <h1>{{ .Title }}</h1>
      {{ with .Params.external_url }}
      <a href="{{ . }}" target="_blank" class="project-cta-btn">
        Visit Website →
      </a>
      {{ end }}
    </div>
  </div>

  <div class="project-container">
    <div class="project-content">
      {{ .Content }}
    </div>

    {{ with .Params.external_url }}
    <div class="project-footer-cta">
      <a href="{{ . }}" target="_blank" class="project-cta-btn-secondary">
        Explore {{ $.Title }} →
      </a>
    </div>
    {{ end }}
  </div>

</article>
{{- end -}}
